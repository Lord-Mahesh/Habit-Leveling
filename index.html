<!DOCTYPE html> 
<html>
<head>
  <title>Life Game</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Habit Leveling</h1>
<h2 id="date"></h2>

<div class="top-bar">
  <div>✨ XP: <span id="xp">0</span></div>
  <div>🔥 Streak: <span id="streak">0</span></div>

  <div>
    🏆 Level: <span id="level">1</span>
    <div class="xp-bar">
      <div id="xp-fill"></div>
    </div>
    <small id="xp-text"></small>
  </div>
</div>

<div class="container">

  <div class="card core">
    <h3>🔒 Core Habits</h3>
    <div id="core"></div>
  </div>

  <div class="card normal">
    <h3>⚡ Normal Habits</h3>
    <div id="normal"></div>
  </div>

  <div class="card bonus">
    <h3>🎁 Bonus</h3>
    <div id="bonus"></div>
  </div>

  <div class="card notes">
    <h3>📝 Notes</h3>
    <textarea id="notes"></textarea>
  </div>

  <div class="card">
    <h3>🧠 Was I Lazy Today?</h3>
    <label><input type="radio" name="lazy" id="lazyNo"> ❌ No (Focused)</label>
    <label><input type="radio" name="lazy" id="lazyYes"> 😴 Yes (Lazy)</label>
  </div>

</div>

<div class="buttons">
  <button class="end" onclick="endDay()">🚀 Complete Day</button>
  <button class="reset" onclick="resetDay()">♻️ Reset Today</button>
</div>

<div style="text-align:center;margin-top:30px;">
  <button onclick="completeReset()" style="
    background: linear-gradient(135deg,#ff0033,#990000);
    color:white;
    padding:14px 28px;
    border:none;
    border-radius:12px;
    font-size:18px;
    box-shadow:0 0 15px red;
    cursor:pointer;
  ">
    💀 Complete Reset
  </button>
</div>

<h3 class="history-title">📅 History</h3>
<div id="history"></div>

<script src="script.js"></script>

</body>
</html>
