<!DOCTYPE html>
<html>
<head>
  <title>Life Game</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎮 Life Game</h1>
<h2 id="date"></h2>

<div class="top-bar">
  <div>✨ XP: <span id="xp">0</span></div>
  <div>🔥 Streak: <span id="streak">0</span></div>

  <div>
    🏆 Level: <span id="level">1</span>
    <div class="xp-bar">
      <div id="xp-fill"></div>
    </div>
    <small id="xp-text"></small>
  </div>
</div>

<div class="container">

  <div class="card core">
    <h3>🔒 Core Habits</h3>
    <div id="core"></div>
  </div>

  <div class="card normal">
    <h3>⚡ Normal Habits</h3>
    <div id="normal"></div>
  </div>

  <div class="card bonus">
    <h3>🎁 Bonus</h3>
    <div id="bonus"></div>
  </div>

  <div class="card notes">
    <h3>📝 Notes</h3>
    <textarea id="notes"></textarea>
  </div>

</div>

<div class="buttons">
  <button class="end" onclick="endDay()">🚀 Complete Day</button>
  <button class="reset" onclick="resetDay()">♻️ Reset</button>
</div>

<!-- Danger Zone -->
<div class="danger-zone">
  <button class="danger" onclick="showResetPopup()">💀 Complete Reset</button>
</div>

<!-- Popup -->
<div id="reset-popup" class="popup">
  <div class="popup-box">
    <h3>⚠️ WARNING</h3>
    <p>This will erase EVERYTHING:<br>
    XP, Level, Streak, Notes & History.</p>

    <button class="confirm" onclick="completeReset()">YES, RESET</button>
    <button class="cancel" onclick="closePopup()">Cancel</button>
  </div>
</div>

<h3 class="history-title">📅 History</h3>
<div id="history"></div>

<script src="script.js"></script>

</body>
</html>
